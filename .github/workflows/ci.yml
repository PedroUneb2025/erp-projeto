name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://erp:erp@localhost:5432/erp_test
      JWT_SECRET: segredo-de-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Aplicar migrações do banco
        run: |
          sudo apt-get install -y postgresql-client
          psql "$DATABASE_URL" -f db/migration/V1__erp_schema_base.sql
          psql "$DATABASE_URL" -f db/migration/V2__usuarios_roles.sql
          psql "$DATABASE_URL" -f db/migration/V3__dados_demo.sql
          psql "$DATABASE_URL" -f db/migration/V5__obrigacoes_ia_bi.sql

      - name: Testes de validação do banco (triggers, procedures, views)
        run: psql "$DATABASE_URL" -f db/migration/V4__validacao.sql 2>&1 | tee validacao.log
      - name: Garantir que todos os testes de banco passaram
        run: grep -q "TODOS OS TESTES PASSARAM" validacao.log
          grep -q "TODOS OS TESTES V5 PASSARAM" validacao.log

      - name: Testes de API
        working-directory: backend
        run: |
          npm install
          npm test
