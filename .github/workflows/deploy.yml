name: Deploy

on:
  push: { branches: [main] }

jobs:
  deploy-render:
    # só roda se o secret RENDER_HOOK_URL estiver configurado
    if: ${{ secrets.RENDER_HOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy no Render
        run: curl -sf "${{ secrets.RENDER_HOOK_URL }}"
