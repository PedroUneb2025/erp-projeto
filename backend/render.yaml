services:
  - type: web
    name: erp-avancado-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false        # cole a connection string do Neon no painel
      - key: JWT_SECRET
        generateValue: true
