name: erp-d-test
services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: erp_test_owner
      POSTGRES_DB: erp_test
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Defina TEST_DB_PASSWORD}
      APP_DB_PASSWORD: ${TEST_DB_PASSWORD}
      BI_DB_PASSWORD: ${TEST_DB_PASSWORD}
      METABASE_DB_PASSWORD: ${TEST_DB_PASSWORD}
    volumes: ["./db/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_test_owner -d erp_test"]
      interval: 3s
      retries: 30
  flyway:
    image: flyway/flyway:10.20.1
    command: ["-connectRetries=60", "migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/erp_test
      FLYWAY_USER: erp_test_owner
      FLYWAY_PASSWORD: ${TEST_DB_PASSWORD}
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes: ["./db/migrations:/flyway/sql:ro"]
    depends_on:
      postgres: {condition: service_healthy}
  mongo:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      retries: 30
  tests:
    build: ./backend
    command: ["pytest", "-q"]
    environment:
      TEST_DATABASE_URL: postgresql://erp_test_owner:${TEST_DB_PASSWORD}@postgres:5432/erp_test
      DATABASE_URL: postgresql://erp_app:${TEST_DB_PASSWORD}@postgres:5432/erp_test
      MONGO_URL: mongodb://mongo:27017/erp
      JWT_SECRET: ${TEST_JWT_SECRET:?Defina TEST_JWT_SECRET}
      ALLOW_TEST_FIXTURES: "1"
    depends_on:
      flyway: {condition: service_completed_successfully}
      mongo: {condition: service_healthy}
